<svg width="450" height="180" viewBox="0 0 450 180" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="'Segoe UI', Ubuntu, Sans-Serif">
  <style>
    .header { font: 700 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8B5CF6; }
    .lang   { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .card   { fill: #0b0b0f; }
    @keyframes barAnim {
      from { stroke-dashoffset: 400; }
      to   { stroke-dashoffset: 0; }
    }
    .bar { stroke-dasharray: 400; animation: barAnim 1.2s ease-in-out forwards; }
  </style>
  <rect width="450" height="180" rx="6" class="card"/>
  <text x="25" y="35" class="header">most used languages</text>

  <g transform="translate(25, 60)">
    <rect x="0" y="0" width="400" height="8" rx="4" fill="#161b22"/>
    <rect x="0" y="0" width="258" height="8" rx="4" fill="#e34c26" class="bar"/>
    <rect x="258" y="0" width="110" height="8" fill="#f1e05a" class="bar" style="animation-delay:200ms"/>
    <rect x="368" y="0" width="30" height="8" fill="#3572A5" class="bar" style="animation-delay:400ms"/>
    <rect x="398" y="0" width="2" height="8" rx="4" fill="#C1F12E" class="bar" style="animation-delay:600ms"/>
  </g>

  <g transform="translate(25, 95)">
    <circle cx="6" cy="6" r="6" fill="#e34c26"/>
    <text x="20" y="10" class="lang">HTML</text>
    <text x="100" y="10" class="lang" fill="#8B5CF6">64.5%</text>
  </g>
  <g transform="translate(175, 95)">
    <circle cx="6" cy="6" r="6" fill="#f1e05a"/>
    <text x="20" y="10" class="lang">JavaScript</text>
    <text x="100" y="10" class="lang" fill="#8B5CF6">27.6%</text>
  </g>

  <g transform="translate(25, 125)">
    <circle cx="6" cy="6" r="6" fill="#3572A5"/>
    <text x="20" y="10" class="lang">Python</text>
    <text x="100" y="10" class="lang" fill="#8B5CF6">7.5%</text>
  </g>
  <g transform="translate(175, 125)">
    <circle cx="6" cy="6" r="6" fill="#C1F12E"/>
    <text x="20" y="10" class="lang">Batchfile</text>
    <text x="100" y="10" class="lang" fill="#8B5CF6">0.4%</text>
  </g>

  <text x="225" y="165" text-anchor="middle" class="lang" opacity="0.6" font-size="10">based on 3 repos · 74.5 KB analyzed</text>
</svg>
