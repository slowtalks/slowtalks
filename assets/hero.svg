<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="'JetBrains Mono', 'Segoe UI', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="50%" stop-color="#0e0820"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a8ff"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes fadeUp { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform: translateY(0);} }
      @keyframes drawRing { from { stroke-dashoffset: var(--dashLen);} to { stroke-dashoffset: var(--dashEnd);} }
      @keyframes scanmove { 0% { transform: translateX(-200px);} 100% { transform: translateX(900px);} }
      @keyframes pulse { 0%,100% { opacity: 0.4;} 50% { opacity: 1;} }
      @keyframes barGrow { from { width: 0;} }
      @keyframes typing { from { width: 0;} to { width: 100%;} }
      .fade { opacity:0; animation: fadeUp 0.7s ease-out forwards; }
      .scan { animation: scanmove 4s ease-in-out infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .num { font: 700 32px 'JetBrains Mono', monospace; fill: #c9a8ff; }
      .lbl { font: 600 10px 'JetBrains Mono', monospace; fill: #c9d1d9; opacity: 0.7; letter-spacing: 1.5px; }
      .name { font: 800 42px 'JetBrains Mono', monospace; fill: #ffffff; }
      .tag  { font: 500 13px 'JetBrains Mono', monospace; fill: #c9a8ff; opacity: 0.85; }
      .caret { font: 700 42px 'JetBrains Mono', monospace; fill: #8B5CF6; }
    </style>
  </defs>

  <rect width="900" height="340" rx="16" fill="url(#bg)" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect y="0" width="900" height="2" fill="url(#scan)" class="scan"/>

  <g opacity="0.06">
    <path d="M0 60 L900 60 M0 120 L900 120 M0 180 L900 180 M0 240 L900 240 M0 300 L900 300" stroke="#8B5CF6" stroke-width="0.5"/>
    <path d="M60 0 L60 340 M180 0 L180 340 M300 0 L300 340 M420 0 L420 340 M540 0 L540 340 M660 0 L660 340 M780 0 L780 340" stroke="#8B5CF6" stroke-width="0.5"/>
  </g>

  <g transform="translate(40, 70)" class="fade" style="animation-delay:100ms">
    <text class="lbl">$ WHOAMI</text>
    <text y="42" class="name">slow<tspan class="caret pulse">_</tspan></text>
    <text y="72" class="tag">// building quiet things from home</text>
    <text y="92" class="tag" opacity="0.6">// slowtalks.be · python / html / js</text>
  </g>

  <g transform="translate(510, 40)">
    <g transform="translate(0,0)" class="fade" style="animation-delay:200ms">
      <circle cx="45" cy="45" r="38" stroke="#161b22" stroke-width="6" fill="none"/>
      <circle cx="45" cy="45" r="38" stroke="url(#ring)" stroke-width="6" fill="none"
              stroke-linecap="round" stroke-dasharray="238.7" stroke-dashoffset="60"
              transform="rotate(-90 45 45)" filter="url(#glow)"/>
      <text x="45" y="52" text-anchor="middle" class="num" font-size="26">2</text>
      <text x="45" y="105" text-anchor="middle" class="lbl">STARS</text>
    </g>
    <g transform="translate(105,0)" class="fade" style="animation-delay:300ms">
      <circle cx="45" cy="45" r="38" stroke="#161b22" stroke-width="6" fill="none"/>
      <circle cx="45" cy="45" r="38" stroke="url(#ring)" stroke-width="6" fill="none"
              stroke-linecap="round" stroke-dasharray="238.7" stroke-dashoffset="120"
              transform="rotate(-90 45 45)" filter="url(#glow)"/>
      <text x="45" y="52" text-anchor="middle" class="num" font-size="26">7</text>
      <text x="45" y="105" text-anchor="middle" class="lbl">COMMITS</text>
    </g>
    <g transform="translate(210,0)" class="fade" style="animation-delay:400ms">
      <circle cx="45" cy="45" r="38" stroke="#161b22" stroke-width="6" fill="none"/>
      <circle cx="45" cy="45" r="38" stroke="url(#ring)" stroke-width="6" fill="none"
              stroke-linecap="round" stroke-dasharray="238.7" stroke-dashoffset="80"
              transform="rotate(-90 45 45)" filter="url(#glow)"/>
      <text x="45" y="52" text-anchor="middle" class="num" font-size="26">3</text>
      <text x="45" y="105" text-anchor="middle" class="lbl">REPOS</text>
    </g>
    <g transform="translate(315,0)" class="fade" style="animation-delay:500ms">
      <circle cx="45" cy="45" r="38" stroke="#161b22" stroke-width="6" fill="none"/>
      <circle cx="45" cy="45" r="38" stroke="url(#ring)" stroke-width="6" fill="none"
              stroke-linecap="round" stroke-dasharray="238.7" stroke-dashoffset="180"
              transform="rotate(-90 45 45)" filter="url(#glow)"/>
      <text x="45" y="52" text-anchor="middle" class="num" font-size="26">1</text>
      <text x="45" y="105" text-anchor="middle" class="lbl">FOLLOWERS</text>
    </g>
  </g>

  <g transform="translate(40, 210)" class="fade" style="animation-delay:600ms">
    <text class="lbl">$ CAT ~/.LANGS</text>

    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="820" height="14" rx="7" fill="#161b22"/>
      <clipPath id="clip"><rect x="0" y="0" width="820" height="14" rx="7"/></clipPath>
      <g clip-path="url(#clip)">
        <rect x="0" y="0" width="529" height="14" fill="#e34c26">
          <animate attributeName="width" from="0" to="529" dur="1.2s" fill="freeze" begin="0.7s"/>
        </rect>
        <rect x="529" y="0" width="226" height="14" fill="#f1e05a">
          <animate attributeName="width" from="0" to="226" dur="1.2s" fill="freeze" begin="0.9s"/>
        </rect>
        <rect x="755" y="0" width="61" height="14" fill="#3572A5">
          <animate attributeName="width" from="0" to="61" dur="1.2s" fill="freeze" begin="1.1s"/>
        </rect>
        <rect x="816" y="0" width="4" height="14" fill="#C1F12E">
          <animate attributeName="width" from="0" to="4" dur="1.2s" fill="freeze" begin="1.3s"/>
        </rect>
      </g>
    </g>

    <g transform="translate(0, 55)" font-size="11" font-weight="600" fill="#c9d1d9">
      <g><circle cx="6" cy="8" r="5" fill="#e34c26"/><text x="18" y="12">HTML</text><text x="70" y="12" fill="#c9a8ff">64.5%</text></g>
      <g transform="translate(160,0)"><circle cx="6" cy="8" r="5" fill="#f1e05a"/><text x="18" y="12">JavaScript</text><text x="105" y="12" fill="#c9a8ff">27.6%</text></g>
      <g transform="translate(340,0)"><circle cx="6" cy="8" r="5" fill="#3572A5"/><text x="18" y="12">Python</text><text x="80" y="12" fill="#c9a8ff">7.5%</text></g>
      <g transform="translate(500,0)"><circle cx="6" cy="8" r="5" fill="#C1F12E"/><text x="18" y="12">Batchfile</text><text x="90" y="12" fill="#c9a8ff">0.4%</text></g>
    </g>
  </g>

  <g transform="translate(40, 310)" class="fade" style="animation-delay:900ms">
    <text class="lbl" opacity="0.4">$ echo "slow and steady. ship anyway." | ./life.sh</text>
  </g>

  <rect x="0" y="338" width="900" height="2" fill="url(#scan)" class="scan" style="animation-delay:2s"/>
</svg>
